name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip wget lld build-essential \
            libssl-dev libffi-dev python3-dev autoconf automake libtool \
            pkg-config libltdl-dev

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('**/buildozer.spec') }}

      - name: Build APK
        env:
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROIDAPI: "33"
          ANDROIDMINAPI: "21"
        run: |
          SPEC_DIR=$(dirname $(find . -name "buildozer.spec" | head -1))
          echo "Building in: $SPEC_DIR"
          cd "$SPEC_DIR"
          unset ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartEVM-APK
          path: "**/bin/*.apk"
          if-no-files-found: error
