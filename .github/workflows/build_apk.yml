name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget lld \
            build-essential libssl-dev libffi-dev \
            python3-dev autoconf automake libtool \
            pkg-config libltdl-dev cmake

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Cache Buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-ndk25b-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-ndk25b-

      - name: Build APK
        run: |
          # Wipe ALL system Android env vars so buildozer uses its own NDK 25b
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME \
                ANDROID_NDK_ROOT ANDROID_NDK ANDROID_NDK_LATEST_HOME
          SPEC_DIR=$(dirname $(find . -name "buildozer.spec" | head -1))
          echo "Building from: $SPEC_DIR"
          cd "$SPEC_DIR"
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartEVM-APK
          path: "**/bin/*.apk"
          if-no-files-found: error
